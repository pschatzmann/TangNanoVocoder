sentence=Neural text to speech split between an ESP32 and a Tang Nano 20K FPGA that runs the vocoder.
paragraph=Header-only client for the TangNanoVocoder gateware: TinyTTS runs up to its flow on the ESP32-S3, the latent goes over SPI or UART, and the Tang Nano 20K runs the TinyTTS vocoder in hardware and plays the audio over I2S or a PWM pin. Includes the FPGA program image, the link protocol, and SPI/Serial transports. Needs the TinyTTS library for text to speech.
